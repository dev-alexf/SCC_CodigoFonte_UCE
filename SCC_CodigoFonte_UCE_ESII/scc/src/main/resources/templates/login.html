<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Login - SCC</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<div class="login-page">
    <div class="login-card">
        <div class="login-logo">📊</div>
        <h1 class="login-title">Controle de Cobrancas</h1>
        <p class="login-sub">Escritorio de Contabilidade &mdash; Uni-FACEF 2026</p>

        <div class="alert alert-error" th:if="${param.erro}">
            Login ou senha incorretos. Tente novamente.
        </div>
        <div class="alert alert-success" th:if="${param.logout}">
            Voce saiu do sistema com sucesso.
        </div>

        <form th:action="@{/login}" method="post">
            <div class="form-group">
                <label class="form-label" for="username">Login</label>
                <input id="username" name="username" type="text" class="form-control"
                       placeholder="admin ou funcionario" required autofocus/>
            </div>
            <div class="form-group">
                <label class="form-label" for="password">Senha</label>
                <input id="password" name="password" type="password" class="form-control"
                       placeholder="••••••••" required/>
            </div>
            <button type="submit" class="btn btn-primary btn-block">Entrar</button>
        </form>

        <div class="login-hint">
            <strong>Demonstracao:</strong><br/>
            Admin: <code>admin</code> / <code>admin123</code><br/>
            Funcionario: <code>funcionario</code> / <code>func123</code>
        </div>
    </div>
</div>
</body>
</html>
