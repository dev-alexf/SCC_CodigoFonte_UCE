<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Cliente - SCC</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<nav class="navbar">
    <div class="nav-brand"><span>&#128202;</span><span class="nav-title">Escritorio de Contabilidade</span></div>
    <div class="nav-links">
        <a th:href="@{/dashboard}"     class="nav-link">&#127968; Dashboard</a>
        <a th:href="@{/clientes}"      class="nav-link active">&#128101; Clientes</a>
        <a th:href="@{/inadimplencia}" class="nav-link">&#128308; Inadimplencia</a>
        <a th:href="@{/relatorios}" sec:authorize="hasRole('ADMIN')" class="nav-link">&#128200; Relatorios</a>
    </div>
    <div class="nav-user">
        <span class="nav-username">&#128100; <span sec:authentication="name">usuario</span></span>
        <form th:action="@{/logout}" method="post" style="display:inline">
            <button class="btn btn-sm btn-outline" type="submit">Sair</button>
        </form>
    </div>
</nav>

<div class="page-content">
    <div class="page-header">
        <div>
            <h1 class="page-title" th:text="${editando ? 'Editar Cliente' : 'Novo Cliente'}"></h1>
            <p class="page-subtitle">Preencha os dados do cliente</p>
        </div>
        <a th:href="@{/clientes}" class="btn btn-ghost">&larr; Voltar</a>
    </div>

    <div class="card">
        <form th:action="@{/clientes/salvar}" method="post" th:object="${cliente}">
            <input type="hidden" th:field="*{id}"/>

            <div class="form-group">
                <label class="form-label">Tipo de Cliente</label>
                <div class="gap-row">
                    <label style="cursor:pointer;display:flex;gap:.4rem;align-items:center">
                        <input type="radio" name="tipo" value="PF"
                               th:checked="${cliente.tipo == 'PF' || cliente.tipo == null}"/>
                        Pessoa Fisica (PF)
                    </label>
                    <label style="cursor:pointer;display:flex;gap:.4rem;align-items:center">
                        <input type="radio" name="tipo" value="PJ"
                               th:checked="${cliente.tipo == 'PJ'}"/>
                        Pessoa Juridica (PJ)
                    </label>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label class="form-label" for="nome">Nome *</label>
                    <input id="nome" th:field="*{nome}" type="text" class="form-control"
                           placeholder="Nome ou Razao Social" required/>
                    <span style="color:red;font-size:.8rem" th:if="${#fields.hasErrors('nome')}"
                          th:errors="*{nome}"></span>
                </div>
                <div class="form-group">
                    <label class="form-label" for="sobrenome">Sobrenome / Complemento</label>
                    <input id="sobrenome" th:field="*{sobrenome}" type="text" class="form-control"
                           placeholder="Sobrenome (PF) ou ME/LTDA (PJ)"/>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label class="form-label" for="cpf">CPF / CNPJ</label>
                    <input id="cpf" th:field="*{cpf}" type="text" class="form-control"
                           placeholder="000.000.000-00"/>
                </div>
                <div class="form-group">
                    <label class="form-label" for="telefone">Celular / Telefone</label>
                    <input id="telefone" th:field="*{telefone}" type="text" class="form-control"
                           placeholder="(16) 99999-9999"/>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label class="form-label" for="email">E-mail</label>
                    <input id="email" th:field="*{email}" type="email" class="form-control"
                           placeholder="cliente@email.com"/>
                </div>
                <div class="form-group">
                    <label class="form-label" for="contaGov">Conta GOV.BR</label>
                    <input id="contaGov" th:field="*{contaGov}" type="text" class="form-control"
                           placeholder="CPF ou login GOV.BR"/>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label" for="observacoes">Observacoes / Outros dados</label>
                <textarea id="observacoes" th:field="*{observacoes}" class="form-control"
                          rows="3" placeholder="Informacoes adicionais..."></textarea>
            </div>

            <div class="form-actions">
                <a th:href="@{/clientes}" class="btn btn-ghost">Cancelar</a>
                <button type="submit" class="btn btn-primary"
                        th:text="${editando ? 'Salvar Alteracoes' : 'Cadastrar Cliente'}"></button>
            </div>
        </form>
    </div>
</div>
</body>
</html>
